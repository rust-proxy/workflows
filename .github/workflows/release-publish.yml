name: Publish Release

on:
  workflow_call:
    inputs:
      cliff-config:
        description: 'Path to git-cliff config file'
        required: false
        type: string
        default: '.github/cliff.toml'
      create-latest-on-push:
        description: 'When true, create or update a "latest" release on non-tag pushes'
        required: false
        type: boolean
        default: false
      publish-mode:
        description: 'publish|draft'
        required: false
        type: string
        default: 'publish'
      target-repository:
        description: 'Target repository in OWNER/REPO format (default: current repository)'
        required: false
        type: string
        default: ''
      target-commitish:
        description: 'Commit SHA or branch name for the release tag in target repository'
        required: false
        type: string
        default: ''
    secrets:
      token:
        description: 'GitHub token or PAT with write access to target repository (default: secrets.GITHUB_TOKEN)'
        required: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # git-cliff's GitHub integration reads pull requests for contributor/PR
      # enrichment; without this the token (scoped to none-by-default once any
      # permission is set) gets HTTP 403 on /pulls.
      pull-requests: read
    steps:
      #--------------------------------------------------
      # Setup Steps
      #--------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*-binaries"
          path: ./packages
          merge-multiple: true

      #--------------------------------------------------
      # Changelog Generation
      #--------------------------------------------------
      - name: Delete latest tag (for git-cliff)
        if: startsWith(github.ref, 'refs/tags/v')
        run: git tag -d latest || true

      - name: Generate changelog
        if: startsWith(github.ref, 'refs/tags/v')
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: ${{ inputs.cliff-config }}
          args: --latest --strip header
        env:
          GITHUB_REPO: ${{ github.repository }}
          # git-cliff's GitHub integration (contributors / PR numbers) calls the
          # GitHub API, which is rate-limited to 403 when unauthenticated.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      #--------------------------------------------------
      # Release Publishing
      #--------------------------------------------------
      - name: Publish stable release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.token || secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          RELEASE_NOTES: ${{ steps.git-cliff.outputs.content }}
          TARGET_REPO: ${{ inputs.target-repository }}
          TARGET_COMMITISH: ${{ inputs.target-commitish }}
        run: |
          gh release create "$TAG_NAME" \
            $( [ -n "$TARGET_REPO" ] && echo "--repo $TARGET_REPO" ) \
            $( [ -n "$TARGET_COMMITISH" ] && echo "--target $TARGET_COMMITISH" ) \
            --title "$TAG_NAME" \
            --notes "$RELEASE_NOTES" \
            $( [ "${{ inputs.publish-mode }}" = "draft" ] && echo "--draft" ) \
            packages/* LICENSE*

      - name: Delete existing latest release and tag
        if: ${{ inputs.create-latest-on-push && !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.token || secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ inputs.target-repository || github.repository }}
        run: |
          gh release delete latest --cleanup-tag --yes --repo "$TARGET_REPO" || true
          git tag -d latest || true

      - name: Generate changelog (unreleased)
        if: ${{ inputs.create-latest-on-push && !startsWith(github.ref, 'refs/tags/v') }}
        uses: orhun/git-cliff-action@v4
        id: git-cliff-nightly
        with:
          config: ${{ inputs.cliff-config }}
          args: --unreleased --strip header
        env:
          GITHUB_REPO: ${{ github.repository }}
          # git-cliff's GitHub integration (contributors / PR numbers) calls the
          # GitHub API, which is rate-limited to 403 when unauthenticated.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish latest (nightly) release
        if: ${{ inputs.create-latest-on-push && !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.token || secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ steps.git-cliff-nightly.outputs.content }}
          TARGET_REPO: ${{ inputs.target-repository }}
          TARGET_COMMITISH: ${{ inputs.target-commitish || github.sha }}
        run: |
          gh release create latest \
            $( [ -n "$TARGET_REPO" ] && echo "--repo $TARGET_REPO" ) \
            --title "latest" \
            --prerelease \
            --target "$TARGET_COMMITISH" \
            --notes "$RELEASE_NOTES" \
            $( [ "${{ inputs.publish-mode }}" = "draft" ] && echo "--draft" ) \
            packages/* LICENSE*
