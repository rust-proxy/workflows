name: Publish Release

on:
  workflow_call:
    inputs:
      cliff-config:
        description: 'Path to git-cliff config file'
        required: false
        type: string
        default: '.github/cliff.toml'
      create-latest-on-push:
        description: 'When true, create or update a "latest" release on non-tag pushes'
        required: false
        type: boolean
        default: false
      publish-mode:
        description: 'publish|draft'
        required: false
        type: string
        default: 'publish'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      #--------------------------------------------------
      # Setup Steps
      #--------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*-binaries"
          path: ./packages
          merge-multiple: true

      #--------------------------------------------------
      # Tag cleanup (for git-cliff to work correctly)
      #--------------------------------------------------
      - name: Delete latest tag (for git-cliff on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        run: git tag -d latest || true

      - name: Delete existing latest release and tag
        if: ${{ inputs.create-latest-on-push && !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes --repo $GITHUB_REPOSITORY || true
          git tag latest -f || true

      #--------------------------------------------------
      # Changelog Generation
      #--------------------------------------------------
      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: ${{ inputs.cliff-config }}
          args: --latest --strip header
        env:
          GITHUB_REPO: ${{ github.repository }}

      #--------------------------------------------------
      # Release Publishing
      #--------------------------------------------------
      - name: Publish stable release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: false
          draft: ${{ inputs.publish-mode == 'draft' }}
          generate_release_notes: false
          body: ${{ steps.git-cliff.outputs.content }}
          files: |
            packages/*
            LICENSE*

      - name: Publish latest (nightly) release
        uses: softprops/action-gh-release@v2
        if: ${{ inputs.create-latest-on-push && !startsWith(github.ref, 'refs/tags/v') }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: true
          draft: ${{ inputs.publish-mode == 'draft' }}
          generate_release_notes: false
          body: ${{ steps.git-cliff.outputs.content }}
          tag_name: "latest"
          files: |
            packages/*
            LICENSE*
