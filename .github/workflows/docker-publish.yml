name: Build and Publish Docker Image

on:
  workflow_call:
    inputs:
      registrys:
        description: 'List of registries to login and push, format: username:password@registry (one per line). GHCR is always included automatically.'
        required: false
        type: string
        default: ''
      docker-file:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: '.github/Dockerfile'
      image-name:
        description: 'Base name of the Docker image'
        required: false
        type: string
        default: 'bin'
      platforms:
        description: 'Platforms to build for'
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
      binary-dir:
        description: 'Directory containing the binaries'
        required: false
        type: string
        default: './docker-bins'
      server-binary-amd64:
        description: 'Path to amd64 server binary'
        required: false
        type: string
        default: 'bin-x86_64-linux-musl'
      server-binary-arm64:
        description: 'Path to arm64 server binary'
        required: false
        type: string
        default: 'bin-aarch64-linux-musl'

jobs:
  docker:
    name: Docker
    runs-on: ubuntu-latest
    steps:
      #--------------------------------------------------
      # Setup Steps
      #--------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU for multi-architecture builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --debug

      #--------------------------------------------------
      # Binary Preparation
      #--------------------------------------------------
      - name: Download compiled binaries
        uses: actions/download-artifact@v8
        with:
          pattern: "*-binaries"
          path: ${{ inputs.binary-dir }}
          merge-multiple: true

      - name: Fix binary permissions
        run: chmod +x ${{ inputs.binary-dir }}/*

      #--------------------------------------------------
      # Docker Registry Authentication
      #--------------------------------------------------
      - name: Login to registries
        run: |
          # Always login to GHCR
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.repository_owner }}" --password-stdin

          # Login to additional registries from inputs.registrys
          while IFS= read -r line; do
            # Skip empty lines
            [[ -z "$line" ]] && continue
            # Parse username:password@registry
            registry="${line##*@}"
            userpass="${line%@*}"
            username="${userpass%%:*}"
            password="${userpass#*:}"
            echo "Logging in to ${registry}..."
            echo "${password}" | docker login "${registry}" -u "${username}" --password-stdin
          done <<'REGISTRYS_EOF'
          ${{ inputs.registrys }}
          REGISTRYS_EOF

      #--------------------------------------------------
      # Docker Tag Management
      #--------------------------------------------------
      - name: Configure Docker image tags
        id: docker_tags
        run: |
          # Build GHCR tags
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="0.0.0"
          fi

          TAGS="ghcr.io/${GITHUB_REPOSITORY_OWNER@L}/${{ inputs.image-name }}:${VERSION}"
          TAGS+=$'\n'"ghcr.io/${GITHUB_REPOSITORY_OWNER@L}/${{ inputs.image-name }}:latest"

          # Build extra registry tags from inputs.registrys
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            registry="${line##*@}"
            username="${line%%:*}"
            TAGS+=$'\n'"${registry}/${username}/${{ inputs.image-name }}:${VERSION}"
            TAGS+=$'\n'"${registry}/${username}/${{ inputs.image-name }}:latest"
          done <<'REGISTRYS_EOF'
          ${{ inputs.registrys }}
          REGISTRYS_EOF

          # Write multi-line output
          {
            echo "TAGS<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      #--------------------------------------------------
      # Docker Build & Push
      #--------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.docker-file }}
          platforms: ${{ inputs.platforms }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.docker_tags.outputs.TAGS }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BINARY_DIR=${{ inputs.binary-dir }}
            SERVER_BINARY_AMD64=${{ inputs.server-binary-amd64 }}
            SERVER_BINARY_ARM64=${{ inputs.server-binary-arm64 }}