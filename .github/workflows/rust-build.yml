name: Build Rust Binary

on:
  workflow_call:
    inputs:
      rust-toolchain:
        description: 'Rust toolchain to use'
        required: false
        type: string
        default: 'stable'
      packages:
        description: 'Comma-separated list of package names'
        required: true
        type: string
      target-config-file:
        description: 'Path to the TOML file containing target configurations'
        required: false
        type: string
        default: '.github/target.toml'
      run-tests:
        description: 'Whether to run tests (can be overridden by matrix config)'
        required: false
        type: boolean
        default: true
      cache-key-prefix:
        description: 'Prefix for cache key to avoid collisions'
        required: false
        type: string
        default: 'rust-build'
      rustflags:
        description: 'Additional RUSTFLAGS to pass to the compiler'
        required: false
        type: string
        default: ''
      enable-tmate:
        description: 'Enable tmate session on failure for debugging'
        required: false
        type: boolean
        default: false
      enable-sccache:
        description: 'Enable sccache for distributed compilation caching'
        required: false
        type: boolean
        default: true
      sccache-max-size:
        description: 'Maximum size of sccache cache (e.g. 2G, 500M)'
        required: false
        type: string
        default: '1G'
      cache-targets:
        description: 'Which build artifacts to cache: "true" (all), "release" (release only, smaller), or "false" (no target caching)'
        required: false
        type: string
        default: 'release'
      only-clippy-tests-on-pr:
        description: 'If true, run clippy and tests only on pull_request events. If false, run clippy/tests on any event.'
        required: false
        type: boolean
        default: false
    secrets:
      sentry-dsn:
        description: 'Sentry DSN for error reporting'
        required: false

defaults:
  run:
    shell: bash

env:
  RUSTC_BOOTSTRAP: "1"
  RUST_TOOLCHAIN: "stable"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      target_config: ${{ steps.parse_config.outputs.targets }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install toml2json and jaq
        uses: taiki-e/install-action@v2
        with:
          tool: toml2json,jaq

      - name: Parse TOML configuration
        id: parse_config
        run: |
          if [ ! -f "${{ inputs.target-config-file }}" ]; then
            echo "Error: Target configuration file not found at ${{ inputs.target-config-file }}"
            exit 1
          fi
          TARGETS_JSON=$(toml2json ${{ inputs.target-config-file }} | jaq -c '.target')
          echo "targets=$TARGETS_JSON" >> $GITHUB_OUTPUT

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt

      - name: Check formatting
        run: |
          cargo +nightly fmt --all -- --check

      - name: Spell Check Repo
        uses: crate-ci/typos@v1.44.0
        env:
          CLICOLOR: 1

  compile:
    needs: prepare
    name: ${{ matrix.release-name || matrix.target || 'Unknown' }}
    permissions:
      contents: write
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.target_config) }}

    steps:
      #--------------------------------------------------
      # Setup Steps
      #--------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 1

      # ── Sccache: restore/auto-save disk cache + local disk setup ──
      - name: Determine sccache directory
        if: inputs.enable-sccache
        id: sccache-dir
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            echo "dir=/tmp/sccache" >> "$GITHUB_OUTPUT"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            echo "dir=$HOME/.sccache" >> "$GITHUB_OUTPUT"
          else
            # Windows: bash $HOME returns MSYS2 path (/c/Users/...), use USERPROFILE
            echo "dir=${USERPROFILE}/.sccache" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Setup sccache cache
        if: inputs.enable-sccache
        uses: actions/cache@v4
        with:
          path: ${{ steps.sccache-dir.outputs.dir }}
          # Unique key per run ensures cache is always saved at post step
          key: ${{ inputs.cache-key-prefix }}-sccache-${{ matrix.release-name || matrix.target }}-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ inputs.cache-key-prefix }}-sccache-${{ matrix.release-name || matrix.target }}-${{ hashFiles('**/Cargo.lock') }}-
            ${{ inputs.cache-key-prefix }}-sccache-${{ matrix.release-name || matrix.target }}-

      - name: Install sccache
        if: inputs.enable-sccache
        uses: taiki-e/install-action@v2
        with:
          tool: sccache

      - name: Setup sccache (local disk mode)
        if: inputs.enable-sccache
        run: |
          SCCACHE_DIR="${{ steps.sccache-dir.outputs.dir }}"
          export SCCACHE_DIR
          mkdir -p "$SCCACHE_DIR"
          chmod -R u+w "$SCCACHE_DIR" 2>/dev/null || true
          echo "SCCACHE_DIR=$SCCACHE_DIR" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=${{ inputs.sccache-max-size }}" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "AWS_LC_SYS_PREBUILT_NASM=1" >> "$GITHUB_ENV"

          # Enable network host for cross containers to reach host services
          echo "CROSS_CONTAINER_OPTS=--network host" >> "$GITHUB_ENV"
          # Start sccache server on default port for host/native builds
          sccache --start-server || echo "sccache server already running"
      - name: Setup sccache cache
        if: inputs.enable-sccache
        id: sccache-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Linux' && '/tmp/sccache' || '~/.sccache' }}
          # Unique key per run ensures cache is always saved at post step
          key: ${{ inputs.cache-key-prefix }}-sccache-${{ matrix.release-name || matrix.target }}-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ inputs.cache-key-prefix }}-sccache-${{ matrix.release-name || matrix.target }}-${{ hashFiles('**/Cargo.lock') }}-
            ${{ inputs.cache-key-prefix }}-sccache-${{ matrix.release-name || matrix.target }}-

      - name: Install sccache
        if: inputs.enable-sccache
        uses: taiki-e/install-action@v2
        with:
          tool: sccache

      - name: Setup sccache (local disk mode)
        if: inputs.enable-sccache
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            # /tmp/sccache is shared with cross containers via /tmp volume mount
            SCCACHE_DIR="/tmp/sccache"
          else
            SCCACHE_DIR="$HOME/.sccache"
          fi
          mkdir -p "$SCCACHE_DIR"
          chmod -R u+w "$SCCACHE_DIR" 2>/dev/null || true
          echo "SCCACHE_DIR=$SCCACHE_DIR" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "AWS_LC_SYS_PREBUILT_NASM=1" >> "$GITHUB_ENV"
          echo "SCCACHE_SERVER_PORT=14266" >> "$GITHUB_ENV"
          # Enable network host for cross containers so they can reach host
          echo "CROSS_CONTAINER_OPTS=--network host" >> "$GITHUB_ENV"
          # Start sccache server on dedicated port for cross container access
          sccache --start-server || echo "sccache server already running"
        shell: bash

      - name: Setup Sentry DSN
        run: |
          if [ -n "${{ secrets.sentry-dsn }}" ]; then
            echo "SENTRY_DSN=${{ secrets.sentry-dsn }}" >> $GITHUB_ENV
          fi

      # ── Rust cache (only when sccache disabled) ──
      - name: Setup Rust cache
        if: ${{ !inputs.enable-sccache }}
        uses: Itsusinn/rust-cache@master
        with:
          shared-key: ${{ inputs.cache-key-prefix }}-${{ matrix.release-name || matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          cache-targets: ${{ inputs.cache-targets }}
          cache-directories: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain || inputs.rust-toolchain }}
          targets: ${{ matrix.build-std && 'x86_64-unknown-linux-gnu' || matrix.target }}
          components: ${{ matrix.components || matrix.build-std && 'rustfmt,clippy,rust-src' || 'rustfmt, clippy' }}

      - uses: rui314/setup-mold@v1
        if: matrix.mold
        with:
          make-default: ${{ matrix.mold }}

      - name: Install cross-compilation tools
        if: matrix.tool == 'cross'
        run: |
          if [ "${{ matrix.build-std }}" != "true" ]; then
            rustup target add ${TARGET}
          fi
          cargo install cross --git https://github.com/cross-rs/cross --force
        env:
          TARGET: ${{ matrix.target }}

      - name: Print build information
        run: |
          echo "Building for target: ${{ matrix.target }}"
          echo "Using toolchain: ${{ matrix.toolchain || inputs.rust-toolchain }}"
          echo "Building packages: ${{ inputs.packages }}"

      #--------------------------------------------------
      # Code Quality Steps
      #--------------------------------------------------

      - name: Run linter
        if: ${{ (inputs.only-clippy-tests-on-pr && github.event_name == 'pull_request') || (!inputs.only-clippy-tests-on-pr) }}
        uses: clechasseur/rs-cargo@v4
        with:
          tool: ${{ matrix.tool }}
          command: clippy
          args: --all --target ${{ matrix.target }} ${{ matrix.build-std && '-Z build-std=std,panic_abort' || '' }} ${{ matrix.extra-args }} -- -D warnings
        env:
          RUSTFLAGS: ${{ matrix.rustflags }} ${{ inputs.rustflags }}

      #--------------------------------------------------
      # Build & Test Steps
      #--------------------------------------------------
      - name: Run tests
        uses: clechasseur/rs-cargo@v4
        if: ${{ ((inputs.only-clippy-tests-on-pr && github.event_name == 'pull_request') || (!inputs.only-clippy-tests-on-pr)) && inputs.run-tests != false && !matrix.skip-test }}
        with:
          tool: ${{ matrix.tool }}
          command: test
          args: --all --target ${{ matrix.target }} ${{ matrix.build-std && '-Z build-std=std,panic_abort' || '' }} ${{ matrix.extra-args }} -- --nocapture
        env:
          RUSTFLAGS: ${{ matrix.rustflags }} ${{ inputs.rustflags }}

      - name: Prepare package args
        id: pkgargs
        shell: bash
        run: |
          IFS=',' read -ra PACKAGES <<< "${{ inputs.packages }}"
          PKG_ARGS=""
          if [ -n "${PACKAGES[0]}" ]; then
            for p in "${PACKAGES[@]}"; do
              p_trimmed=$(echo "$p" | xargs)
              if [ -n "$p_trimmed" ]; then
                PKG_ARGS="$PKG_ARGS --package $p_trimmed"
              fi
            done
          fi
          echo "PKG_ARGS=$PKG_ARGS" >> $GITHUB_OUTPUT

      - name: Build release binaries
        id: build
        uses: clechasseur/rs-cargo@v4
        with:
          tool: ${{ matrix.tool }}
          command: build
          args: ${{ steps.pkgargs.outputs.PKG_ARGS }} --release --target ${{ matrix.target }} ${{ matrix.build-std && '-Z build-std=std,panic_abort' || '' }} ${{ matrix.extra-args }} --timings
        env:
          RUSTFLAGS: ${{ matrix.rustflags }} ${{ inputs.rustflags }}
          CROSS_BUILD_ZIG: ${{ matrix.zig }}

      #--------------------------------------------------
      # Sccache Stats
      #--------------------------------------------------
      - name: Show sccache stats
        if: inputs.enable-sccache
        run: sccache --show-stats

      #--------------------------------------------------
      # Artifact Steps
      #--------------------------------------------------
      - name: Prepare binary artifacts
        shell: bash
        id: prepare-artifacts
        run: |
          mkdir -p artifacts
          IFS=',' read -ra PACKAGES <<< "${{ inputs.packages }}"
          for package in "${PACKAGES[@]}"; do
            source_file="target/${{ matrix.target }}/release/${package}${{ matrix.postfix }}"
            target_file="artifacts/${package}-${{ matrix.release-name || matrix.target }}${{ matrix.postfix }}"
            cp "$source_file" "$target_file"
          done
          mkdir -p timings
          cp target/cargo-timings/cargo-timing.html timings/timings-${{ matrix.release-name || matrix.target }}.html

      - name: Upload binary artifacts
        if: ${{ matrix.skip-upload != true }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.release-name || matrix.target }}-binaries
          path: artifacts/
          if-no-files-found: error
          retention-days: ${{ matrix.retention-days || 1 }}

      - name: Upload timings
        if: ${{ matrix.skip-upload != true }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.release-name || matrix.target }}-timings
          path: timings/
          retention-days: ${{ matrix.retention-days || 1 }}

      - name: Setup tmate session
        if: ${{ inputs.enable-tmate && failure() }}
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true
          timeout-minutes: 15
          limit-access-to-actor: true

  post:
    needs: compile
    permissions:
      contents: write
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: timings
          pattern: "*-timings"
          delete-merged: true